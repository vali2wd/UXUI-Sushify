<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda în Grup - Sushify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .mobile-container {
            width: 412px;
            height: 915px;
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #f4f4f4;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #777;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            color: #f39c12;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            flex: 1;
            text-align: center;
        }

        .header-spacer {
            width: 30px;
        }

        .section {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-label {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .code-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #f5b05d;
            border-radius: 16px;
            font-size: 16px;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f1e4cf;
            color: #333;
            transition: all 0.3s ease;
        }

        .code-input:focus {
            outline: none;
            border-color: #f39c12;
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.1);
        }

        .code-input::placeholder {
            color: #a3957e;
        }

        .code-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 30px 20px;
            background: linear.gradient(135deg, #fafafa 0%, #f4f4f4 100%);
            border-radius: 20px;
            text-align: center;
        }

        .code-label {
            font-size: 12px;
            color: #a3957e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .generated-code {
            font-size: 48px;
            font-weight: 700;
            color: #f39c12;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #f9c784 0%, #f5af59 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .code-info {
            font-size: 12px;
            color: #777;
            margin-bottom: 30px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #f39c12;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.25);
            margin-bottom: 10px;
        }

        .submit-btn:hover {
            background-color: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(243, 156, 18, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(243, 156, 18, 0.25);
        }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-overlay.active {
            display: flex;
        }

        .popup {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 300px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .popup-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .popup-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .popup-subtext {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
        }

        .popup-btn {
            width: 100%;
            padding: 12px;
            background-color: #f39c12;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .popup-btn:hover {
            background-color: #e67e22;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-title">Comanda în Grup</div>
            <div class="header-spacer"></div>
        </div>

        <div class="section">
            <div class="input-section">
                <div class="input-label">Intră în comanda unei prieteni</div>
                <input
                    type="text"
                    class="code-input"
                    id="codeInput"
                    placeholder="Alatura-te unei camere"
                    maxlength="10"
                />
            </div>

            <div class="code-section">
                <div class="code-label">Codul tău pentru a invita prieteni</div>
                <div class="generated-code" id="generatedCode">#0000</div>
                <div class="code-info">Ai 24 ore pentru a putea imparti comanda</div>
                <button class="submit-btn" onclick="submitCode()">Alaturare la grup</button>
            </div>
        </div>
    </div>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup">
            <div class="popup-icon">✓</div>
            <div class="popup-text">Alaturare cu succes!</div>
            <div class="popup-subtext">Te-ai alăturat grupului cu succes</div>
            <button class="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        // Generate random code on page load
        function generateRandomCode() {
            const randomNum = Math.floor(Math.random() * 9000 + 1000);
            return '#' + randomNum;
        }

        // Initialize page
        function initPage() {
            const code = generateRandomCode();
            document.getElementById('generatedCode').textContent = code;
        }

        // Submit code handler
        function submitCode() {
            const input = document.getElementById('codeInput').value.trim();
            
            if (input.length === 0) {
                alert('Vă rugăm introduceți un cod');
                return;
            }

            // Show success popup
            showPopup();
        }

        // Show popup
        function showPopup() {
            document.getElementById('popupOverlay').classList.add('active');
        }

        // Close popup and redirect
        function closePopup() {
            document.getElementById('popupOverlay').classList.remove('active');
            // Redirect to landing page
            window.location.href = '../LandingPage/LandingPage.html';
        }

        // Go back to previous page
        function goBack() {
            window.location.href = '../LandingPage/LandingPage.html';
        }

        // Allow Enter key to submit
        document.addEventListener('DOMContentLoaded', function() {
            initPage();
            document.getElementById('codeInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitCode();
                }
            });
        });
    </script>
</body>
</html>
